name: Build CraneAdv

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# 关键：显式声明读权限，让 GITHUB_TOKEN 能用于 API 请求
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make fakeroot perl clang lld libssl-dev curl xz-utils jq

      - name: Setup Theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Download Linux Toolchain
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export THEOS=${{ github.workspace }}/theos
          mkdir -p $THEOS/toolchain/linux

          echo "=== 使用认证 API 查询 Linux 工具链 ==="
          # 带 token 的请求，速率限制从 60/小时 提升到 5000/小时
          curl -s -H "Authorization: Bearer $GH_TOKEN" \
               -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/theos/toolchain/releases?per_page=100" \
               -o /tmp/releases.json

          # 检查 API 返回内容
          if ! jq -e 'type == "array"' /tmp/releases.json > /dev/null 2>&1; then
            echo "=== API 返回异常，原始内容如下 ==="
            cat /tmp/releases.json
            exit 1
          fi

          echo "=== 查找 Linux 工具链 asset ==="
          TOOLCHAIN_URL=$(jq -r '
            [.[] | .assets[]?
              | select(.name | test("linux"; "i"))
              | select(.name | test("\\.(tar\\.xz|tar\\.gz|txz)$"; "i"))
              | .browser_download_url
            ] | first // empty
          ' /tmp/releases.json)

          if [ -z "$TOOLCHAIN_URL" ]; then
            echo "未找到 Linux 工具链 asset，列出所有 release 与 asset："
            jq -r '.[] | "Release: \(.tag_name)  Assets: \([.assets[].name] | join(", "))"' /tmp/releases.json
            exit 1
          fi

          echo "=== 下载: $TOOLCHAIN_URL ==="
          cd /tmp
          curl -L -H "Authorization: Bearer $GH_TOKEN" "$TOOLCHAIN_URL" -o toolchain.archive
          file toolchain.archive
          ls -la toolchain.archive

          echo "=== 解压到 $THEOS/toolchain/linux ==="
          cd $THEOS/toolchain/linux
          if file /tmp/toolchain.archive | grep -qi 'XZ'; then
            tar -xJf /tmp/toolchain.archive
          elif file /tmp/toolchain.archive | grep -qi 'LZMA'; then
            tar --lzma -xf /tmp/toolchain.archive
          elif file /tmp/toolchain.archive | grep -qi 'gzip'; then
            tar -xzf /tmp/toolchain.archive
          else
            tar -xf /tmp/toolchain.archive
          fi

          echo "=== 解压后目录结构 ==="
          find . -maxdepth 3 -type d | head -30
          echo "=== 查找 clang ==="
          find . -name clang -type f 2>/dev/null | head -5

      - name: Fix Toolchain Path
        run: |
          export THEOS=${{ github.workspace }}/theos
          if [ ! -f "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            echo "=== 期望路径不存在，开始自动修正 ==="
            CLANG_PATH=$(find $THEOS/toolchain/linux -name clang -type f 2>/dev/null | head -1)
            if [ -n "$CLANG_PATH" ]; then
              echo "找到 clang: $CLANG_PATH"
              BIN_DIR=$(dirname "$CLANG_PATH")
              IPHONE_DIR=$(dirname "$BIN_DIR")
              echo "实际 iPhone 目录: $IPHONE_DIR"
              if [ "$IPHONE_DIR" != "$THEOS/toolchain/linux/iphone" ]; then
                mkdir -p $THEOS/toolchain/linux/iphone
                cp -R "$IPHONE_DIR"/* $THEOS/toolchain/linux/iphone/ || true
              fi
              ls -la $THEOS/toolchain/linux/iphone/bin/ | head -10
            else
              echo "警告：完全未找到 clang，工具链可能不是标准结构"
              find $THEOS/toolchain/linux -maxdepth 4 -type f | head -30
            fi
          else
            echo "工具链路径正确"
            ls -la $THEOS/toolchain/linux/iphone/bin/ | head -5
          fi

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Find deb
        run: |
          find . -name "*.deb" -type f

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CraneAdv-deb
          path: "**/*.deb"
          if-no-files-found: error
