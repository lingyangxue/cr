name: Build CraneAdv

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ldid xz make || true

      - name: Setup Theos and SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          rm -rf $HOME/theos/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $HOME/theos/sdks
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Verify environment
        run: |
          echo "=== clang 版本 ==="
          clang --version
          echo "=== ld 版本（应该是 Apple 的 ld） ==="
          ld -v 2>&1 || ld --version 2>&1 || true
          echo "=== Theos 目录 ==="
          ls -la $HOME/theos/
          echo "=== SDK 列表 ==="
          ls -la $HOME/theos/sdks/ | head -20

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Find deb
        run: |
          find . -name "*.deb" -type f

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CraneAdv-deb
          path: "**/*.deb"
          if-no-files-found: error
