name: Build CraneAdv

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make fakeroot perl \
            clang lld llvm \
            libssl-dev curl xz-utils dpkg \
            libplist-utils libxml2-utils

      - name: Setup Theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Symlink system clang as Theos toolchain
        run: |
          export THEOS=${{ github.workspace }}/theos
          TC=$THEOS/toolchain/linux/iphone
          mkdir -p $TC/bin

          # 系统 clang 作为编译器
          ln -sf $(which clang)   $TC/bin/clang
          ln -sf $(which clang++) $TC/bin/clang++
          ln -sf $(which clang)   $TC/bin/cc
          ln -sf $(which clang++) $TC/bin/c++

          # LLVM lld 作为链接器（关键：iOS 需要 Mach-O 格式的链接器）
          ln -sf $(which ld.lld)   $TC/bin/ld    2>/dev/null || true
          ln -sf $(which ld64.lld) $TC/bin/ld64  2>/dev/null || true
          ln -sf $(which lld)      $TC/bin/lld   2>/dev/null || true

          # 常用 binutils
          for bin in ar ranlib nm strip size objcopy objdump; do
            if command -v llvm-$bin >/dev/null 2>&1; then
              ln -sf $(which llvm-$bin) $TC/bin/$bin
            elif command -v $bin >/dev/null 2>&1; then
              ln -sf $(which $bin) $TC/bin/$bin
            fi
          done

          echo "=== 工具链目录内容 ==="
          ls -la $TC/bin/
          echo "=== 测试 clang 版本 ==="
          $TC/bin/clang --version

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Find deb
        run: |
          find . -name "*.deb" -type f

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CraneAdv-deb
          path: "**/*.deb"
          if-no-files-found: error
