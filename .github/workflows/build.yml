name: Build CraneAdv

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot make git perl clang curl xz-utils dpkg

      - name: Setup Theos, SDKs and Toolchain
        run: |
          export THEOS=${{ github.workspace }}/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          
          # 1. 克隆 Theos 主仓库
          git clone --recursive https://github.com/theos/theos.git $THEOS
          
          # 2. 删除自带的空 sdks 占位，克隆真正的 SDK
          rm -rf $THEOS/sdks
          git clone https://github.com/theos/sdks.git $THEOS/sdks
          
          # 3. 关键修复：下载并解压 Linux 工具链
          mkdir -p $THEOS/toolchain/linux
          curl -L https://github.com/theos/toolchain/releases/download/linux-2023/toolchain.tar.xz | tar -xJ -C $THEOS/toolchain/linux/

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Find deb
        run: |
          find . -name "*.deb" -type f

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CraneAdv-deb
          path: "**/*.deb"
          if-no-files-found: error
