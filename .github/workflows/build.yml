name: Build CraneAdv

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make fakeroot perl \
            clang lld llvm \
            libssl-dev curl xz-utils dpkg \
            libplist-utils libxml2-utils

      - name: Setup Theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Install ld64.lld and override system ld
        run: |
          export THEOS=${{ github.workspace }}/theos

          echo "=== 查找 ld64.lld（只搜可执行文件，排除测试目录） ==="
          find_ld64() {
            find /usr/bin /usr/local/bin /usr/lib/llvm-*/bin \
                 -maxdepth 1 -name "ld64.lld*" -type f -executable 2>/dev/null | head -1
          }

          LD64=$(find_ld64)

          if [ -z "$LD64" ]; then
            echo "标准路径未找到，安装 lld-18..."
            sudo apt-get install -y lld-18 || true
            LD64=$(find_ld64)
          fi

          if [ -z "$LD64" ]; then
            echo "退而求其次，全盘搜索可执行文件并排除测试目录..."
            LD64=$(find /usr -name "ld64.lld*" -type f -executable \
                   2>/dev/null | grep -v -E "/(tests|Inputs|share|doc)/" | head -1)
          fi

          if [ -z "$LD64" ]; then
            echo "=== 致命错误：未找到可执行的 ld64.lld ==="
            echo "列出所有相关文件（含是否可执行）："
            find /usr -name "*ld64*" 2>/dev/null | head -20
            echo "已安装的 lld 相关包："
            dpkg -l | grep -i lld || true
            exit 1
          fi

          echo "找到可执行的 ld64.lld: $LD64"
          ls -la "$LD64"
          "$LD64" --version

          # 工具链符号链接
          TC=$THEOS/toolchain/linux/iphone
          mkdir -p $TC/bin

          ln -sf $(which clang)   $TC/bin/clang
          ln -sf $(which clang++) $TC/bin/clang++
          ln -sf $(which clang)   $TC/bin/cc
          ln -sf $(which clang++) $TC/bin/c++

          ln -sf "$LD64" $TC/bin/ld
          ln -sf "$LD64" $TC/bin/ld64

          echo "=== 覆盖 /usr/bin/ld ==="
          sudo rm -f /usr/bin/ld
          sudo ln -sf "$LD64" /usr/bin/ld
          ls -la /usr/bin/ld

          for bin in ar ranlib nm strip size objcopy objdump; do
            if command -v llvm-$bin >/dev/null 2>&1; then
              ln -sf $(which llvm-$bin) $TC/bin/$bin
            elif command -v $bin >/dev/null 2>&1; then
              ln -sf $(which $bin) $TC/bin/$bin
            fi
          done

          echo "=== 工具链内容 ==="
          ls -la $TC/bin/

          echo "=== 验证 ==="
          $TC/bin/clang --version
          /usr/bin/ld --version || true

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Find deb
        run: |
          find . -name "*.deb" -type f

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CraneAdv-deb
          path: "**/*.deb"
          if-no-files-found: error
