name: Build CraneAdv

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make fakeroot perl clang lld libssl-dev curl xz-utils

      - name: Setup Theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Download Linux Toolchain
        run: |
          export THEOS=${{ github.workspace }}/theos
          mkdir -p $THEOS/toolchain/linux

          echo "=== 从 GitHub API 获取所有 Linux 工具链下载地址 ==="
          curl -s https://api.github.com/repos/theos/toolchain/releases \
            | grep 'browser_download_url' \
            | grep -i 'linux' \
            | sed 's/.*"\(https:[^"]*\)".*/\1/' > /tmp/urls.txt
          cat /tmp/urls.txt

          TOOLCHAIN_URL=$(head -1 /tmp/urls.txt)
          if [ -z "$TOOLCHAIN_URL" ]; then
            echo "未找到 Linux 工具链，列出仓库所有 release:"
            curl -s https://api.github.com/repos/theos/toolchain/releases
            exit 1
          fi

          echo "=== 下载: $TOOLCHAIN_URL ==="
          cd /tmp
          curl -L "$TOOLCHAIN_URL" -o toolchain.archive
          file toolchain.archive
          ls -la toolchain.archive

          echo "=== 解压到 $THEOS/toolchain/linux ==="
          cd $THEOS/toolchain/linux
          if file /tmp/toolchain.archive | grep -qi 'XZ'; then
            tar -xJf /tmp/toolchain.archive
          elif file /tmp/toolchain.archive | grep -qi 'LZMA'; then
            tar --lzma -xf /tmp/toolchain.archive
          elif file /tmp/toolchain.archive | grep -qi 'gzip'; then
            tar -xzf /tmp/toolchain.archive
          else
            tar -xf /tmp/toolchain.archive
          fi

          echo "=== 解压后结构 ==="
          ls -la
          echo "=== 查找 clang ==="
          find . -name clang -type f 2>/dev/null | head -5
          find . -maxdepth 3 -type d 2>/dev/null | head -20

      - name: Fix Toolchain Path
        run: |
          export THEOS=${{ github.workspace }}/theos
          # 如果解压出来的不是 iphone/bin/clang 结构，就自动修正
          if [ ! -f "$THEOS/toolchain/linux/iphone/bin/clang" ]; then
            CLANG_PATH=$(find $THEOS/toolchain/linux -name clang -type f 2>/dev/null | head -1)
            if [ -n "$CLANG_PATH" ]; then
              echo "找到 clang: $CLANG_PATH"
              BIN_DIR=$(dirname "$CLANG_PATH")
              # 往上找到 iphone 目录
              IPHONE_DIR=$(dirname "$BIN_DIR")
              echo "iPhone 目录: $IPHONE_DIR"
              if [ "$IPHONE_DIR" != "$THEOS/toolchain/linux/iphone" ]; then
                mkdir -p $THEOS/toolchain/linux/iphone
                cp -R "$IPHONE_DIR"/* $THEOS/toolchain/linux/iphone/ || true
              fi
            else
              echo "警告：未找到 clang，跳过路径修正"
            fi
          fi
          ls -la $THEOS/toolchain/linux/ 2>/dev/null || true

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Find deb
        run: |
          find . -name "*.deb" -type f

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CraneAdv-deb
          path: "**/*.deb"
          if-no-files-found: error
