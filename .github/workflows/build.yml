name: Build CraneAdv

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make fakeroot perl \
            clang lld llvm \
            libssl-dev curl xz-utils dpkg \
            libplist-utils libxml2-utils

      - name: Setup Theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Symlink system clang as Theos toolchain
        run: |
          export THEOS=${{ github.workspace }}/theos
          TC=$THEOS/toolchain/linux/iphone
          mkdir -p $TC/bin

          # 1. clang 编译器
          ln -sf $(which clang)   $TC/bin/clang
          ln -sf $(which clang++) $TC/bin/clang++
          ln -sf $(which clang)   $TC/bin/cc
          ln -sf $(which clang++) $TC/bin/c++

          # 2. 关键：ld 必须指向 ld64.lld（Apple Mach-O 兼容），不能是 ld.lld
          echo "=== 查找 ld64.lld ==="
          LD64=$(which ld64.lld 2>/dev/null || find /usr -name "ld64.lld*" 2>/dev/null | head -1)
          if [ -z "$LD64" ]; then
            echo "未找到 ld64.lld，尝试 apt 安装 lld-18..."
            sudo apt-get install -y lld-18 || true
            LD64=$(find /usr -name "ld64.lld*" 2>/dev/null | head -1)
          fi
          echo "使用 ld64.lld: $LD64"
          if [ -z "$LD64" ]; then
            echo "致命错误：未找到 ld64.lld"
            exit 1
          fi
          ln -sf $LD64 $TC/bin/ld
          ln -sf $LD64 $TC/bin/ld64

          # 3. LLVM 工具
          for bin in ar ranlib nm strip size objcopy objdump; do
            if command -v llvm-$bin >/dev/null 2>&1; then
              ln -sf $(which llvm-$bin) $TC/bin/$bin
            elif command -v $bin >/dev/null 2>&1; then
              ln -sf $(which $bin) $TC/bin/$bin
            fi
          done

          echo "=== 工具链目录内容 ==="
          ls -la $TC/bin/

          echo "=== 测试 clang ==="
          $TC/bin/clang --version

          echo "=== 测试 ld64.lld ==="
          $TC/bin/ld --version || true

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Find deb
        run: |
          find . -name "*.deb" -type f

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CraneAdv-deb
          path: "**/*.deb"
          if-no-files-found: error
