name: Build CraneAdv

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot make git perl clang

      - name: Clone Theos and SDKs
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos
          rm -rf ${{ github.workspace }}/theos/sdks
          git clone https://github.com/theos/sdks.git ${{ github.workspace }}/theos/sdks

      - name: Set up Theos environment
        run: |
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV
          echo "${{ github.workspace }}/theos/bin" >> $GITHUB_PATH

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Find deb
        run: |
          find . -name "*.deb" -type f

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CraneAdv-deb
          path: "**/*.deb"
          if-no-files-found: error
