name: Build CraneAdv

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git make fakeroot perl \
            clang lld llvm \
            libssl-dev curl xz-utils dpkg \
            libplist-utils libxml2-utils

      - name: Setup Theos
        run: |
          export THEOS=${{ github.workspace }}/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          rm -rf $THEOS/sdks
          git clone --depth 1 https://github.com/theos/sdks.git $THEOS/sdks
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH

      - name: Build a working ld64.lld
        run: |
          export THEOS=${{ github.workspace }}/theos

          echo "=== 寻找真实的 lld 二进制文件（不是符号链接） ==="
          REAL_LLD=""
          for c in /usr/bin/lld-18 /usr/bin/lld-17 /usr/bin/lld-16 \
                   /usr/lib/llvm-18/bin/lld /usr/lib/llvm-17/bin/lld /usr/lib/llvm-16/bin/lld; do
            if [ -x "$c" ] && [ ! -L "$c" ]; then
              REAL_LLD="$c"
              echo "✓ 找到真实二进制: $c"
              break
            fi
          done

          if [ -z "$REAL_LLD" ]; then
            echo "=== 没有真实 lld，尝试安装 lld-18 ==="
            sudo apt-get install -y lld-18
            for c in /usr/bin/lld-18 /usr/lib/llvm-18/bin/lld; do
              if [ -x "$c" ] && [ ! -L "$c" ]; then
                REAL_LLD="$c"
                echo "✓ 安装后找到: $c"
                break
              fi
            done
          fi

          if [ -z "$REAL_LLD" ]; then
            echo "=== 致命错误：找不到真实的 lld 二进制文件 ==="
            echo "所有 lld 相关文件（含符号链接状态）："
            ls -la /usr/bin/*lld* /usr/lib/llvm-*/bin/*lld* 2>/dev/null || true
            exit 1
          fi

          echo "=== 复制并重命名为 ld64.lld（关键：argv[0] 触发 Mach-O 模式） ==="
          sudo cp "$REAL_LLD" /usr/local/bin/ld64.lld
          sudo chmod 755 /usr/local/bin/ld64.lld
          LD64=/usr/local/bin/ld64.lld
          ls -la "$LD64"
          file "$LD64"

          echo "=== 验证 ld64.lld 能否以 Mach-O 模式运行 ==="
          "$LD64" --version
          echo "test" | "$LD64" -v 2>&1 | head -5 || true

          # 工具链目录
          TC=$THEOS/toolchain/linux/iphone
          mkdir -p $TC/bin

          ln -sf $(which clang)   $TC/bin/clang
          ln -sf $(which clang++) $TC/bin/clang++
          ln -sf $(which clang)   $TC/bin/cc
          ln -sf $(which clang++) $TC/bin/c++

          ln -sf "$LD64" $TC/bin/ld
          ln -sf "$LD64" $TC/bin/ld64

          echo "=== 覆盖 /usr/bin/ld ==="
          sudo rm -f /usr/bin/ld
          sudo ln -sf "$LD64" /usr/bin/ld
          ls -la /usr/bin/ld

          for bin in ar ranlib nm strip size objcopy objdump; do
            if command -v llvm-$bin >/dev/null 2>&1; then
              ln -sf $(which llvm-$bin) $TC/bin/$bin
            elif command -v $bin >/dev/null 2>&1; then
              ln -sf $(which $bin) $TC/bin/$bin
            fi
          done

          echo "=== 工具链内容 ==="
          ls -la $TC/bin/

          echo "=== 验证 ==="
          $TC/bin/clang --version
          /usr/bin/ld --version || true

      - name: Build Tweak
        run: |
          make clean
          make package

      - name: Find deb
        run: |
          find . -name "*.deb" -type f

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: CraneAdv-deb
          path: "**/*.deb"
          if-no-files-found: error
